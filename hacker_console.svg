<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="420" style="background: #06090e; border: 1px solid #00e5ff; border-radius: 6px; font-family: monospace;">
  <!-- Styles for keyframe animations inside SVG -->
  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { fill: #00ff66; opacity: 1; } 50% { fill: #ff4a4a; opacity: 0.8; } }
    @keyframes scan { 0% { transform: translateY(-10px); } 100% { transform: translateY(430px); } }
    @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .cursor { animation: blink 1s infinite; fill: #00ff66; }
    .scanline { animation: scan 5s linear infinite; stroke: rgba(0, 229, 255, 0.15); stroke-width: 2; }
    .alert-box { animation: pulse 2s infinite; }
    .rotating-globe { transform-origin: 650px 210px; animation: rotate 20s linear infinite; }
    .text-green { fill: #00ff66; }
    .text-cyan { fill: #00e5ff; }
    .text-red { fill: #ff4a4a; }
    .text-muted { fill: #64748b; }
    .text-white { fill: #ffffff; }
  </style>

  <!-- CRT Grid Background -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 229, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- CRT Scanline -->
  <line x1="0" y1="0" x2="800" y2="0" class="scanline" />

  <!-- macOS Buttons -->
  <circle cx="20" cy="20" r="6" fill="#ff4a4a" />
  <circle cx="36" cy="20" r="6" fill="#e9b813" />
  <circle cx="52" cy="20" r="6" fill="#00ff66" />
  <text x="76" y="24" class="text-muted" font-size="12">guest@sudonishant-exploit: ~ (PORT_EXPLOIT_SIMULATION)</text>

  <line x1="10" y1="35" x2="790" y2="35" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1" />

  <!-- Terminal shell typing simulations -->
  <g font-size="14" font-family="monospace">
    <!-- Command 1 -->
    <text x="25" y="70" class="text-cyan">guest@sudonishant:~$ <tspan class="text-white">nmap -sV -T4 sudonishant.github.io</tspan></text>
    <text x="25" y="90" class="text-muted">[+] Initiating Nmap stealth scan on ports...</text>
    <text x="25" y="110" class="text-muted">[+] Discovered open port: 443/tcp (HTTPS)</text>

    <!-- Command 2 -->
    <text x="25" y="145" class="text-cyan">guest@sudonishant:~$ <tspan class="text-white">exploit -target sudonishant.github.io</tspan></text>
    <text x="25" y="165" fill="#e9b813">[!] Injecting shellcode payload... [OK]</text>
    <text x="25" y="185" class="text-green">[+] Interactive meterpreter shell established!</text>

    <!-- Host info -->
    <text x="25" y="230" class="text-cyan">[+] HOST:      <tspan class="text-white">sudonishant (18 Year Old)</tspan></text>
    <text x="25" y="250" class="text-cyan">[+] ROLE:      <tspan class="text-white">Security Researcher &amp; Ethical Hacker</tspan></text>
    <text x="25" y="270" class="text-cyan">[+] TARGETS:   <tspan class="text-green">Active Threat Intelligence Auditing</tspan></text>
    <text x="25" y="290" class="text-cyan">[+] STATUS:    <tspan class="text-green">ONLINE / ACTIVE</tspan></text>

    <!-- Capabilities -->
    <text x="25" y="330" class="text-white">[+] System Hardening : [██████████░░░░░░] 60%</text>
    <text x="25" y="350" class="text-white">[+] Python Scripting : [████████████░░░░] 70%</text>
    <text x="25" y="370" class="text-white">[+] Web Pentesting   : [███████████░░░░░] 65%</text>
  </g>

  <!-- Right side: Rotating Cyber Target Globe Vector -->
  <g class="rotating-globe">
    <circle cx="650" cy="210" r="100" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1" />
    <circle cx="650" cy="210" r="70" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1" stroke-dasharray="5,5" />
    <circle cx="650" cy="210" r="40" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" />
    
    <!-- Crosshairs -->
    <line x1="535" y1="210" x2="765" y2="210" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1" />
    <line x1="650" y1="95" x2="650" y2="325" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1" />
    
    <!-- Outer radar line -->
    <line x1="650" y1="210" x2="720" y2="140" stroke="#00e5ff" stroke-width="2" />
    
    <!-- Rotating target dot -->
    <circle cx="720" cy="140" r="4" fill="#ff4a4a" />
  </g>

  <!-- Central Warn/Compromise alert box -->
  <g transform="translate(480, 280)">
    <rect x="0" y="0" width="280" height="90" rx="4" fill="rgba(10, 14, 20, 0.95)" stroke="#00e5ff" stroke-width="1.5" />
    <rect x="5" y="5" width="270" height="25" rx="2" class="alert-box" fill="#00ff66" opacity="0.8" />
    <text x="140" y="22" font-size="12" font-weight="bold" fill="#05070a" text-anchor="middle" font-family="monospace">SYSTEM COMPROMISED</text>
    <text x="14" y="52" class="text-white" font-size="11" font-family="monospace">ROOT_SHELL_SESSION: ACTIVE</text>
    <text x="14" y="72" class="text-cyan" font-size="11" font-family="monospace">TARGET: sudonishant.github.io</text>
  </g>

  <!-- CLI blinking cursor at command prompt -->
  <rect x="525" y="133" width="8" height="15" class="cursor" />
</svg>
